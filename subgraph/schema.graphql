type Builder @entity(immutable: false) {
  "the wallet that registered — this is the identity, nothing else"
  id: Bytes!
  name: String!
  token: Bytes!
  "the NFT you were minted — its id is your row number"
  badgeId: BigInt!
  firstSeen: BigInt!
  updatedAt: BigInt!
  "how many times they changed their entry"
  writes: BigInt!
}

type Board @entity(immutable: false) {
  id: Bytes!
  total: BigInt!
}
