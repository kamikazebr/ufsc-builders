specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UFSCBuilders
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # <- paste yours
      abi: UFSCBuilders
      startBlock: 0                                          # <- deploy block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Builder, Board]
      abis:
        - name: UFSCBuilders
          file: ./abis/UFSCBuilders.json
      eventHandlers:
        - event: Registered(indexed address,string,address)
          handler: handleRegistered
        - event: BadgeSet(indexed address,address)
          handler: handleBadgeSet
      file: ./src/mapping.ts
