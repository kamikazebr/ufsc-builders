<!doctype html>
<meta charset="utf-8">
<title>UFSCBuilders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0B0E13;--ground-2:#10151D;--line:#242D3B;
  --ink:#E9EDF4;--ink-2:#9AA5B8;--ink-3:#616D80;
  --accent:#5B9CF8;--good:#57C99A;--warn:#F2A33C;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;padding:clamp(20px,3vw,48px);
}
header{display:flex;align-items:baseline;gap:clamp(16px,2.5vw,40px);
  border-bottom:1px solid var(--line);padding-bottom:clamp(14px,2vh,24px);
  margin-bottom:clamp(18px,2.6vh,34px);flex-wrap:wrap}
h1{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-.02em;
  font-size:clamp(1.8rem,4vw,3.4rem);margin:0}
.count{font-family:'Archivo',sans-serif;font-weight:800;color:var(--accent);
  font-size:clamp(2rem,5vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums}
.count small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
  font-size:clamp(10px,.8vw,13px);letter-spacing:.2em;color:var(--ink-3);
  text-transform:uppercase;margin-top:6px}
#status{margin-left:auto;font-size:clamp(11px,.85vw,14px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
#status.live{color:var(--good)}
#status.err{color:var(--warn)}
#local{display:none;font-family:'IBM Plex Mono',monospace;font-size:clamp(10px,.78vw,12px);
  letter-spacing:.12em;text-transform:uppercase;color:var(--warn);
  border:1px solid var(--warn);border-radius:999px;padding:5px 12px}
body.localchain #local{display:inline-block}
body.localchain .field a{pointer-events:none}
body.localchain .field a code{color:var(--ink-2);opacity:.75}

ul{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));
  gap:clamp(10px,1.4vw,18px)}
li{border:1px solid var(--line);border-radius:10px;background:var(--ground-2);
  padding:clamp(12px,1.6vh,18px) clamp(14px,1.4vw,20px);
  display:flex;flex-direction:column;gap:6px;animation:in .45s ease both}
li.fresh{border-color:var(--good);background:rgba(87,201,154,.09)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){li{animation:none}}
.rank{font-size:clamp(10px,.75vw,12px);letter-spacing:.18em;color:var(--ink-3)}
.name{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.01em;
  font-size:clamp(1.05rem,1.7vw,1.6rem);word-break:break-word}
.field{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.field span{font-size:clamp(9px,.62vw,11px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.field code{font-size:clamp(11px,.88vw,15px);word-break:break-all;
  line-height:1.4;color:var(--ink-2)}
/* An <a> with no colour of its own falls back to the browser's link blue and
   visited purple. On a near-black board that is unreadable, so every anchor
   inherits and every field states its own colour. */
.field a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.field.wal code{color:var(--ink-2)}
.field.tok code{color:#7FB4FF}
.field.bdg code{color:#D8B4FF}
.field code.pending{color:var(--ink-3);font-style:italic}
.field a:hover code,.field a:focus-visible code{color:#fff}
.field a:hover,.field a:focus-visible{border-bottom-color:currentColor}
.empty{color:var(--ink-3);font-size:clamp(.95rem,1.4vw,1.3rem);
  border:1px dashed var(--line);border-radius:10px;padding:clamp(24px,4vh,48px);
  text-align:center;grid-column:1/-1}
.setup{position:fixed;inset:0;background:var(--ground);z-index:10;
  display:flex;align-items:center;justify-content:center;padding:24px}
.setup .box{max-width:640px;width:100%}
.setup label{display:block;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin:18px 0 6px}
.setup input{width:100%;background:var(--ground-2);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:inherit;padding:12px 14px}
.setup button{margin-top:22px;background:var(--accent);color:#06121f;border:0;
  border-radius:8px;font:inherit;font-weight:500;padding:12px 22px;cursor:pointer}
.setup p{color:var(--ink-2);font-size:14px;line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>

<div class="setup" id="setup"><div class="box">
  <h1>UFSCBuilders</h1>
  <p>Paste the deployed <code>UFSCBuilders</code> address. Saved locally, so you only do this once.</p>
  <label for="addr">UFSCBuilders contract address</label>
  <input id="addr" placeholder="0x…" autocomplete="off" spellcheck="false">
  <label for="rpc">Sepolia RPC</label>
  <input id="rpc" value="https://ethereum-sepolia-rpc.publicnode.com" spellcheck="false">
  <label for="exp">Explorer base</label>
  <input id="exp" value="https://sepolia.etherscan.io" spellcheck="false">
  <button id="go">Start the board</button>
</div></div>

<header>
  <h1>UFSCBuilders</h1>
  <div class="count"><span id="n">0</span><small>BUILDERS ON THE BOARD</small></div>
  <span id="local">local chain — explorer links off</span>
  <div id="status">connecting</div>
</header>
<ul id="list"><li class="empty">Waiting for the first registration…</li></ul>

<script>
(function () {
  "use strict";
  var SEL_ALL = '0x10c4e8b0';                 // all()
  var setup = document.getElementById('setup');
  var listEl = document.getElementById('list');
  var statusEl = document.getElementById('status');
  var nEl = document.getElementById('n');
  var CFG = { addr: localStorage.getItem('sr.addr') || '', rpc: localStorage.getItem('sr.rpc') || '', exp: localStorage.getItem('sr.exp') || 'https://sepolia.etherscan.io' };
  var known = {};
  var first = true;

  function start() {
    // A local chain reuses anvil's deterministic addresses, which exist on every
    // public testnet too and belong to nobody. Linking them to an explorer sends
    // you to a stranger's transaction history. Don't.
    var isLocal = /localhost|127\.0\.0\.1|0\.0\.0\.0/.test(CFG.rpc);
    document.body.classList.toggle('localchain', isLocal);
    setup.style.display = 'none';
    poll();
    setInterval(poll, 5000);
  }

  document.getElementById('go').addEventListener('click', function () {
    var a = document.getElementById('addr').value.trim();
    var r = document.getElementById('rpc').value.trim();
    if (!/^0x[0-9a-fA-F]{40}$/.test(a)) { alert('That is not a contract address.'); return; }
    CFG.addr = a; CFG.rpc = r;
    CFG.exp = document.getElementById('exp').value.trim().replace(/\/$/, '');
    localStorage.setItem('sr.addr', a); localStorage.setItem('sr.rpc', r);
    localStorage.setItem('sr.exp', CFG.exp);
    start();
  });

  if (CFG.addr && CFG.rpc) {
    document.getElementById('addr').value = CFG.addr;
    document.getElementById('rpc').value = CFG.rpc;
    document.getElementById('exp').value = CFG.exp;
    start();
  }

  /* ---- minimal ABI decoding: Entry[] with a dynamic string ---- */
  function words(hex) {
    hex = hex.replace(/^0x/, '');
    var out = [];
    for (var p = 0; p < hex.length; p += 64) out.push(hex.slice(p, p + 64));
    return out;
  }
  function num(w) { return parseInt(w, 16); }
  function addr(w) { return '0x' + w.slice(24); }
  function str(w, at) {
    var len = num(w[at]), hex = '', k = at + 1;
    while (hex.length < len * 2 && k < w.length) { hex += w[k]; k++; }
    hex = hex.slice(0, len * 2);
    var s = '';
    for (var p = 0; p < hex.length; p += 2) s += String.fromCharCode(parseInt(hex.substr(p, 2), 16));
    try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
  }

  function decode(result) {
    var w = words(result);
    if (!w.length) return [];
    var base = num(w[0]) / 32;                 // offset to the array
    var len = num(w[base]);
    var heads = base + 1;
    var out = [];
    for (var k = 0; k < len; k++) {
      var e = heads + num(w[heads + k]) / 32;  // element start (relative to heads)
      out.push({
        who:   addr(w[e]),
        name:  str(w, e + num(w[e + 1]) / 32),
        token: addr(w[e + 2]),
        at:    num(w[e + 3]),
        badge: k + 1            // token id IS the row number, 1-based
      });
    }
    return out;
  }

  function poll() {
    fetch(CFG.rpc, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0', id: 1, method: 'eth_call',
        params: [{ to: CFG.addr, data: SEL_ALL }, 'latest']
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) throw new Error(j.error.message);
      render(decode(j.result));
      statusEl.textContent = 'live';
      statusEl.className = 'live';
    })
    .catch(function (err) {
      statusEl.textContent = 'rpc error — ' + err.message;
      statusEl.className = 'err';
    });
  }

  function render(entries) {
    nEl.textContent = entries.length;
    if (!entries.length) return;
    entries = entries.slice().sort(function (a, b) { return b.at - a.at; });
    listEl.innerHTML = '';
    entries.forEach(function (e, k) {
      var li = document.createElement('li');
      if (!first && !known[e.who]) li.className = 'fresh';
      known[e.who] = true;
      // Full addresses, not shortened — students copy these off the projector
      // during BUILD 3. A truncated address makes the exercise impossible.
      var ZERO = '0x0000000000000000000000000000000000000000';
      function badgeLink(id) {
        var body = '<code>#' + id + '</code>';
        if (!document.body.classList.contains('localchain')) {
          body = '<a href="' + CFG.exp + '/nft/' + CFG.addr + '/' + id +
                 '" target="_blank" rel="noopener">' + body + '</a>';
        }
        return '<span class="field bdg"><span>badge</span>' + body + '</span>';
      }
      function link(label, a, cls) {
        if (!a || a === ZERO) {
          return '<span class="field ' + cls + '"><span>' + label +
                 '</span><code class="pending">not yet</code></span>';
        }
        return '<span class="field ' + cls + '"><span>' + label + '</span>' +
               '<a href="' + CFG.exp + '/address/' + a + '" target="_blank" rel="noopener">' +
               '<code>' + a + '</code></a></span>';
      }
      li.innerHTML =
        '<span class="rank">#' + (entries.length - k) + '</span>' +
        '<span class="name"></span>' +
        link('wallet', e.who, 'wal') +
        link('token', e.token, 'tok') +
        badgeLink(e.badge);
      li.querySelector('.name').textContent = e.name;   // never innerHTML: student input
      listEl.appendChild(li);
    });
    first = false;
  }
})();
</script>
